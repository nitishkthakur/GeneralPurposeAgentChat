<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>General Purpose Agent Chat</title>
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Roboto Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    
    <style>
        :root {
            /* Deep Blue Primary Color Theme */
            --md-primary: #0D47A1;
            --md-primary-light: #5472D3;
            --md-primary-dark: #002171;
            --md-on-primary: #FFFFFF;
            --md-secondary: #1565C0;
            --md-surface: #FFFFFF;
            --md-background: #F5F5F5;
            --md-on-surface: #1C1B1F;
            --md-outline: #79747E;
            --md-surface-variant: #E7E0EC;
            --md-error: #B3261E;
            --md-shadow: rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-background);
            color: var(--md-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* App Bar */
        .app-bar {
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            padding: 16px 24px;
            box-shadow: 0 2px 4px var(--md-shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }

        .app-bar h1 {
            font-size: 1.375rem;
            font-weight: 500;
            letter-spacing: 0.0125em;
        }

        .app-bar .material-icons {
            font-size: 24px;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--md-surface);
            border-radius: 16px;
            box-shadow: 0 1px 3px var(--md-shadow);
            overflow: hidden;
            min-height: 500px;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Message Bubble */
        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background-color: var(--md-primary);
            color: var(--md-on-primary);
        }

        .message.assistant .message-avatar {
            background-color: var(--md-secondary);
            color: var(--md-on-primary);
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background-color: var(--md-primary);
            color: var(--md-on-primary);
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background-color: var(--md-surface-variant);
            color: var(--md-on-surface);
            border-bottom-left-radius: 4px;
        }

        .message-content pre {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.875rem;
        }

        .message-content code {
            font-family: 'Roboto Mono', monospace;
            background-color: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.875rem;
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--md-outline);
            background-color: var(--md-surface);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .text-field {
            flex: 1;
            position: relative;
        }

        .text-field textarea {
            width: 100%;
            min-height: 56px;
            max-height: 200px;
            padding: 16px;
            border: 2px solid var(--md-outline);
            border-radius: 12px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            background-color: var(--md-surface);
        }

        .text-field textarea:focus {
            border-color: var(--md-primary);
        }

        .text-field textarea::placeholder {
            color: var(--md-outline);
        }

        /* Material Button */
        .md-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 56px;
            height: 56px;
            padding: 0 24px;
            border: none;
            border-radius: 16px;
            font-family: 'Roboto', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.0892857143em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .md-button.filled {
            background-color: var(--md-primary);
            color: var(--md-on-primary);
        }

        .md-button.filled:hover {
            background-color: var(--md-primary-dark);
            box-shadow: 0 2px 8px var(--md-shadow);
        }

        .md-button.filled:active {
            transform: scale(0.98);
        }

        .md-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .md-button .material-icons {
            font-size: 24px;
        }

        /* Icon Button */
        .icon-button {
            width: 56px;
            height: 56px;
            padding: 0;
            border-radius: 50%;
        }

        /* Loading State */
        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background-color: var(--md-surface-variant);
            border-radius: 16px;
            color: var(--md-on-surface);
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background-color: var(--md-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Welcome Message */
        .welcome-message {
            text-align: center;
            padding: 48px 24px;
            color: var(--md-outline);
        }

        .welcome-message .material-icons {
            font-size: 64px;
            color: var(--md-primary);
            margin-bottom: 16px;
        }

        .welcome-message h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--md-on-surface);
            margin-bottom: 8px;
        }

        .welcome-message p {
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Tool Chips */
        .tool-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
        }

        .tool-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background-color: var(--md-surface-variant);
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--md-on-surface);
        }

        .tool-chip .material-icons {
            font-size: 16px;
            color: var(--md-primary);
        }

        /* Error State */
        .error-message {
            background-color: #FFEBEE;
            color: var(--md-error);
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 16px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 16px;
            }

            .message {
                max-width: 90%;
            }

            .messages-area {
                padding: 16px;
            }

            .input-area {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body x-data="chatApp()">
    <!-- App Bar -->
    <header class="app-bar">
        <span class="material-icons">smart_toy</span>
        <h1>General Purpose Agent</h1>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <div class="chat-container">
            <!-- Messages Area -->
            <div class="messages-area" x-ref="messagesArea">
                <!-- Welcome Message -->
                <template x-if="messages.length === 0">
                    <div class="welcome-message">
                        <span class="material-icons">psychology</span>
                        <h2>Welcome to Agent Chat</h2>
                        <p>I'm a general purpose AI assistant with access to filesystem and search tools.<br>
                        Ask me to read files, search directories, or help with any task!</p>
                        <div class="tool-chips">
                            <div class="tool-chip">
                                <span class="material-icons">folder</span>
                                File Operations
                            </div>
                            <div class="tool-chip">
                                <span class="material-icons">search</span>
                                Search
                            </div>
                            <div class="tool-chip">
                                <span class="material-icons">code</span>
                                Code Assistance
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Chat Messages -->
                <template x-for="(message, index) in messages" :key="index">
                    <div :class="'message ' + message.role">
                        <div class="message-avatar">
                            <span class="material-icons" x-text="message.role === 'user' ? 'person' : 'smart_toy'"></span>
                        </div>
                        <div class="message-content" x-html="formatMessage(message.content)"></div>
                    </div>
                </template>

                <!-- Loading Indicator -->
                <template x-if="isLoading">
                    <div class="message assistant">
                        <div class="message-avatar">
                            <span class="material-icons">smart_toy</span>
                        </div>
                        <div class="loading-indicator">
                            <div class="loading-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span>Thinking...</span>
                        </div>
                    </div>
                </template>

                <!-- Error Message -->
                <template x-if="error">
                    <div class="error-message">
                        <span class="material-icons">error</span>
                        <span x-text="error"></span>
                    </div>
                </template>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-container">
                    <div class="text-field">
                        <textarea
                            x-model="userInput"
                            @keydown.enter.prevent="!$event.shiftKey && sendMessage()"
                            placeholder="Type your message... (Shift+Enter for new line)"
                            :disabled="isLoading"
                            x-ref="inputField"
                        ></textarea>
                    </div>
                    <button 
                        class="md-button filled icon-button" 
                        @click="sendMessage()"
                        :disabled="isLoading || !userInput.trim()"
                        title="Send message"
                    >
                        <span class="material-icons">send</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        function chatApp() {
            return {
                messages: [],
                userInput: '',
                isLoading: false,
                error: null,
                conversationHistory: [],

                async sendMessage() {
                    if (!this.userInput.trim() || this.isLoading) return;

                    const message = this.userInput.trim();
                    this.userInput = '';
                    this.error = null;

                    // Add user message to display
                    this.messages.push({
                        role: 'user',
                        content: message
                    });

                    // Scroll to bottom
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });

                    this.isLoading = true;

                    try {
                        const response = await fetch('/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                message: message,
                                conversation_history: this.conversationHistory
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();

                        // Add assistant message to display
                        this.messages.push({
                            role: 'assistant',
                            content: data.response
                        });

                        // Update conversation history
                        this.conversationHistory = data.conversation_history;

                    } catch (err) {
                        console.error('Error:', err);
                        this.error = 'Failed to send message. Please try again.';
                    } finally {
                        this.isLoading = false;
                        this.$nextTick(() => {
                            this.scrollToBottom();
                            this.$refs.inputField.focus();
                        });
                    }
                },

                scrollToBottom() {
                    const area = this.$refs.messagesArea;
                    if (area) {
                        area.scrollTop = area.scrollHeight;
                    }
                },

                formatMessage(content) {
                    if (!content) return '';

                    // Escape HTML
                    let formatted = content
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');

                    // Format code blocks
                    formatted = formatted.replace(
                        /```(\w*)\n?([\s\S]*?)```/g,
                        '<pre><code>$2</code></pre>'
                    );

                    // Format inline code
                    formatted = formatted.replace(
                        /`([^`]+)`/g,
                        '<code>$1</code>'
                    );

                    // Format bold
                    formatted = formatted.replace(
                        /\*\*([^*]+)\*\*/g,
                        '<strong>$1</strong>'
                    );

                    // Format newlines
                    formatted = formatted.replace(/\n/g, '<br>');

                    return formatted;
                }
            };
        }
    </script>
</body>
</html>
